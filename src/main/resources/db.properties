mysql.driver=com.mysql.cj.jdbc.Driver
# serverTimezone 使用 Asia/Shanghai（而非 UTC）：
# 若设为 UTC 而 JVM 运行在东八区，java.sql.Date 经 setDate 绑定时会被回退 8 小时，
# 导致按日期区间的查询把前一天的记录也算进来（详见使用说明书"已知问题"）。
mysql.url=jdbc:mysql://localhost:3306/ecommerce?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
mysql.username=root
mysql.password=123456
